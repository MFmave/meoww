<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine?</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #ad2831; /* Soft pink background */
      text-align: center;
      font-family: 'Cursive', sans-serif;
    }
    .love-card {
      width: 35rem;
      background-color: #ffe5d9;
      border-radius: 15px;
      box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1);
      padding: 20px;
      border: 2px solid #ffb6c1;
      margin: auto;
      text-align: center;
    }
    .card-title {
      color: #d63384;
      font-size: 28px;
    }
    .heart {
      font-size: 40px;
      color: #ff4d6d;
    }
    .btn-yes {
      background-color: pink;
      color: white;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 18px;
      position: absolute;
      right: 53%;
    }
    .btn-no {
      background-color: #6c757d;
      color: white;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 18px;
      position: absolute;
      transition: all 0.3s ease;
    }
    .btn-container {
      position: relative;
      height: 80px;
    }
    #hugGif {
      display: none;
      width: 250px;
      margin-top: 20px;
      padding: auto;
      margin-left: auto;
    margin-right: auto;
    border-radius: 10px;
    
    }
    #countdown {
      font-size: 20px;
      color: #d63384;
      margin-top: 10px;
    }

    .btn-gif {
        background-color: pink;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="row min-vh-100 d-flex justify-content-center align-items-center">
    <div class="col-md-6">
      <div class="card love-card">
        <div class="card-body">
          <div class="heart">❤️</div>
          <h5 class="card-title">Erm.. Will you be my Valentine? 💖</h5>
          
          <!-- Countdown Timer -->
          <p id="countdown">Counting down to Valentine's Day... ⏳</p>

          <div class="btn-container">
            <button class="btn btn-yes" onclick="yesAnswer()">Yes</button>
            <button class="btn btn-no" id="noButton" onmouseover="moveNoButton()">No</button>
          </div>

          <!-- Click for a Hug -->
          <br><br>
          <button class="btn btn-gif" onclick="showHug()">click this first for a surprise</button>
          <img id="hugGif" src="https://i.pinimg.com/originals/ce/cc/67/cecc674dc65dd78c3516c08f18803b35.gif">
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function yesAnswer() {
    let heartContainer = document.createElement("div");
    heartContainer.innerHTML = "meow ^^";
    heartContainer.style.position = "fixed";
    heartContainer.style.top = "50%";
    heartContainer.style.left = "50%";
    heartContainer.style.fontSize = "50px";
    heartContainer.style.transform = "translate(-50%, -50%)";
    document.body.appendChild(heartContainer);

    setTimeout(() => {
      window.location.href = "yes.html"; // Redirect after 3 seconds
    }, 3000);
  }

  function moveNoButton() {
    let button = document.getElementById("noButton");
    let x = Math.random() * (window.innerWidth - 150);
    let y = Math.random() * (window.innerHeight - 150);
    button.style.left = `${x}px`;
    button.style.top = `${y}px`;
  }

  function showHug() {
    document.getElementById("hugGif").style.display = "block";
  }

  function updateCountdown() {
    let now = new Date();
    let valentines = new Date(now.getFullYear(), 1, 14, 0, 0, 0);
    let timeLeft = valentines - now;

    if (timeLeft <= 0) {
      document.getElementById("countdown").innerHTML = "Happy Valentine's Day! ❤️🎉";
      return;
    }

    let days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
    let hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    let minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
    let seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

    document.getElementById("countdown").innerHTML = 
      `Valentine's Day in: ${days}d ${hours}h ${minutes}m ${seconds}s 💕`;
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();
</script>

</body>
</html>
