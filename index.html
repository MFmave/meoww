<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .btn {
            background-color: pink;
            border-color: pink;
            font-style: italic;
            font-size: bold;
        }

        .btn:hover {
            background-color: palevioletred;
            border-color: pink;
        }

        .img-thumbnail {
            border-color: pink;
            border-radius: 20px ;
        }

        .form-control {
            border-color: pink;
        }

        body {
            background-color: #ad2831;
        
        }

        .form-label {
            font-style: italic;
            font-weight: bold;
        }



    </style>

  </head>
  <body>
    
    <div class="container py-5">
        <div class="row py-5">
            <div class="col">
            </div>
            <div class="col">
            </div>
          </div>

        <div class="row">
          <div class="col justify-content-end">
            <img src="https://i.pinimg.com/736x/88/8d/ef/888def3297e76696b63ce282a3113d9e.jpg" class="img-thumbnail w-75" alt="...">
          </div>
          <div class="col align-self-center">
            <form id="myForm">
                <div class="mb-3">
                  <label for="exampleInputName" class="form-label">Name</label>
                  <input type="text" class="form-control" id="exampleInputName" name="name" required>
                  <div id="emailHelp" class="form-text">Hint: my nickname for you ^^</div>
                </div>
              
                <div class="mb-3">
                  <label for="exampleInputPassword" class="form-label">Password</label>
                  <input type="password" class="form-control" id="exampleInputPassword" name="password" required>
                  <div class="form-text">Hint: name of your lover </div>
                </div>
              
                <button type="submit" class="btn">Submit</button>
              </form>
              
              <script>
                document.getElementById("myForm").addEventListener("submit", function(event) {
                  event.preventDefault(); // Stop form from submitting
              
                  let name = document.getElementById("exampleInputName").value;
                  let password = document.getElementById("exampleInputPassword").value;
              
                  if ((name === "kuring" || name === "Kuring") && (password === "Mave" || password === "mave")) {
                    window.location.href = "willyou.html"; // Redirect to the next page
                  } else {
                    alert("Invalid name or password. Try again!");
                  }
                });
              </script>
              
          </div>
        </div>
    </div>
 














    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
